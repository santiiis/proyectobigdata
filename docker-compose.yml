version: "3.8"

services:
  # ── Base de Datos MySQL 8 ──
  mysql:
    image: mysql:8.0
    container_name: desercion-mysql
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_password_cambiar}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-desercion_db}
      MYSQL_USER: ${MYSQL_USER:-desercion_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-desercion_pass}
    volumes:
      - mysql_data:/var/lib/mysql
    command: >
      --default-authentication-plugin=mysql_native_password
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --innodb-buffer-pool-size=256M
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ── Servicio de Machine Learning (FastAPI) ──
  ml-service:
    build:
      context: ./apps/ml-service
      dockerfile: Dockerfile
    container_name: desercion-ml
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      ML_API_KEY: ${ML_API_KEY:-ml-api-key-cambiar-en-produccion}
      DATABASE_URL: mysql+pymysql://${MYSQL_USER:-desercion_user}:${MYSQL_PASSWORD:-desercion_pass}@mysql:3306/${MYSQL_DATABASE:-desercion_db}
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysql_data:
    driver: local
